image\":null,\"imageAlt\":\"The sacred syllable Om with ankusha, pasha and modaks\",\"credit\":\"Original placeholder emblem (SVG) — in-house. Replace with commissioned artwork when available.\"},\"theme\":{\"skyTop\":\"#1d0805\",\"skyBottom\":\"#7c2a10\",\"glow\":\"#ffb85a\",\"accent\":\"#ff8a33\",\"motif\":\"temple-hall\"}},{\"slug\":\"vishnu\",\"order\":3,\"enabled\":true,\"name\":\"Lord Vishnu\",\"nameDevanagari\":\"विष्णु\",\"epithet\":\"Narayana · The Preserver\",\"shortDescription\":\"The preserver of the worlds, resting on the cosmic ocean.\",\"description\":\"Vishnu, as Narayana, rests upon the cosmic ocean and sustains the order of all worlds. The shankha calls to dharma, the Sudarshana chakra turns with the wheel of time, the gada stands for strength and the lotus for purity unfolding. Rest here a while in the steadiness of the preserver.\",\"mantra\":{\"devanagari\":\"ॐ नमो भगवते वासुदेवाय\",\"transliteration\":\"Om Namo Bhagavate Vāsudevāya\",\"meaning\":\"Salutations to Lord Vasudeva, who dwells within all beings.\"},\"art\":{\"emblem\":\"vishnu\",\"image\":null,\"imageAlt\":\"Shankha, Sudarshana chakra, gada and lotus\",\"credit\":\"Original placeholder emblem (SVG) — in-house. Replace with commissioned artwork when available.\"},\"theme\":{\"skyTop\":\"#030d22\",\"skyBottom\":\"#0e3a60\",\"glow\":\"#86d6ff\",\"accent\":\"#f3d98b\",\"motif\":\"ocean\"}},{\"slug\":\"krishna\",\"order\":4,\"enabled\":true,\"name\":\"Lord Krishna\",\"nameDevanagari\":\"कृष्ण\",\"epithet\":\"Govinda · The Divine Flute-Player\",\"shortDescription\":\"The flute-player of Vrindavan, whose music draws every heart.\",\"description\":\"Krishna's flute is said to have stilled the cattle, the river and the hearts of all who heard it in Vrindavan. Playful as a child, wise as the teacher of the Gita, he is remembered with the peacock feather and the bansuri. Listen, and let the music lead you inward.\",\"mantra\":{\"devanagari\":\"ॐ श्री कृष्णाय नमः\",\"transliteration\":\"Om Śrī Kṛṣṇāya Namaḥ\",\"meaning\":\"Salutations to Sri Krishna.\"},\"art\":{\"emblem\":\"krishna\",\"image\":null,\"imageAlt\":\"Bansuri flute with a peacock feather\",\"credit\":\"Original placeholder emblem (SVG) — in-house. Replace with commissioned artwork when available.\"},\"theme\":{\"skyTop\":\"#081236\",\"skyBottom\":\"#1b4c68\",\"glow\":\"#7fe6d6\",\"accent\":\"#35b0a8\",\"motif\":\"vrindavan\"}},{\"slug\":\"hanuman\",\"order\":5,\"enabled\":true,\"name\":\"Lord Hanuman\",\"nameDevanagari\":\"हनुमान\",\"epithet\":\"Sankat Mochan · Strength in Devotion\",\"shortDescription\":\"The embodiment of devotion, courage and selfless service.\",\"description\":\"Hanuman, devoted servant of Sri Rama, is remembered for boundless courage held in perfect humility. His gada stands for strength placed in service, and the name of Rama is ever on his lips. Sit with him and draw on steadiness, courage and devotion.\",\"mantra\":{\"devanagari\":\"ॐ हं हनुमते नमः\",\"transliteration\":\"Om Haṃ Hanumate Namaḥ\",\"meaning\":\"Salutations to Hanuman.\"},\"art\":{\"emblem\":\"hanuman\",\"image\":null,\"imageAlt\":\"Gada with a saffron banner bearing the name of Rama, before the rising sun\",\"credit\":\"Original placeholder emblem (SVG) — in-house. Replace with commissioned artwork when available.\"},\"theme\":{\"skyTop\":\"#1f0a03\",\"skyBottom\":\"#a24614\",\"glow\":\"#ffad4d\",\"accent\":\"#ff7a1a\",\"motif\":\"sunrise\"}},{\"slug\":\"durga\",\"order\":6,\"enabled\":true,\"name\":\"Goddess Durga\",\"nameDevanagari\":\"दुर्गा\",\"epithet\":\"Mahishasuramardini · The Invincible Mother\",\"shortDescription\":\"The invincible Mother who protects dharma with fierce compassion.\",\"description\":\"Durga, the invincible one, is the Mother who rises to protect. In her many hands the gods placed their weapons — the trishula, the sword, the discus — and she holds them with the calm of compassion. Come to her for courage and for the reassurance of a mother's protection.\",\"mantra\":{\"devanagari\":\"ॐ दुं दुर्गायै नमः\",\"transliteration\":\"Om Duṃ Durgāyai Namaḥ\",\"meaning\":\"Salutations to Mother Durga.\"},\"art\":{\"emblem\":\"durga\",\"image\":null,\"imageAlt\":\"Trishula, khadga and chakra rising from a lotus\",\"credit\":\"Original placeholder emblem (SVG) — in-house. Replace with commissioned artwork when available.\"},\"theme\":{\"skyTop\":\"#1a0308\",\"skyBottom\":\"#6e0f1f\",\"glow\":\"#ff7a6a\",\"accent\":\"#e8b04a\",\"motif\":\"temple-hall\"}},{\"slug\":\"lakshmi\",\"order\":7,\"enabled\":true,\"name\":\"Goddess Lakshmi\",\"nameDevanagari\":\"लक्ष्मी\",\"epithet\":\"Mahalakshmi · Grace and Abundance\",\"shortDescription\":\"Goddess of grace, prosperity and auspiciousness, seated upon the lotus.\",\"description\":\"Lakshmi rises from the churning of the ocean seated upon a lotus — beauty untouched by the waters around it. She is grace, auspiciousness and abundance in every form: health, harmony, generosity and inner contentment. Offer gratitude here for all that sustains your life.\",\"mantra\":{\"devanagari\":\"ॐ श्रीं महालक्ष्म्यै नमः\",\"transliteration\":\"Om Śrīṃ Mahālakṣmyai Namaḥ\",\"meaning\":\"Salutations to Mahalakshmi.\"},\"art\":{\"emblem\":\"lakshmi\",\"image\":null,\"imageAlt\":\"Purna kalasha upon a lotus with golden coins\",\"credit\":\"Original placeholder emblem (SVG) — in-house. Replace with commissioned artwork when available.\"},\"theme\":{\"skyTop\":\"#22081a\",\"skyBottom\":\"#742844\",\"glow\":\"#ffc8da\",\"accent\":\"#f3c86b\",\"motif\":\"lotus-pond\"}},{\"slug\":\"saraswati\",\"order\":8,\"enabled\":true,\"name\":\"Goddess Saraswati\",\"nameDevanagari\":\"सरस्वती\",\"epithet\":\"Vagdevi · Goddess of Learning\",\"shortDescription\":\"Goddess of knowledge, music and the arts, clothed in white.\",\"description\":\"Saraswati, clothed in white and seated by the flowing river, is the source of speech, learning, music and the arts. The veena, the sacred book and the white lotus are her companions. Students, artists and seekers come to her for clarity of mind and purity of expression.\",\"mantra\":{\"devanagari\":\"ॐ ऐं सरस्वत्यै नमः\",\"transliteration\":\"Om Aiṃ Sarasvatyai Namaḥ\",\"meaning\":\"Salutations to Goddess Saraswati.\"},\"art\":{\"emblem\":\"saraswati\",\"image\":null,\"imageAlt\":\"Veena with a palm-leaf manuscript and white lotus\",\"credit\":\"Original placeholder emblem (SVG) — in-house. Replace with commissioned artwork when available.\"},\"theme\":{\"skyTop\":\"#0d1630\",\"skyBottom\":\"#3b4f78\",\"glow\":\"#fff4dc\",\"accent\":\"#e8eef8\",\"motif\":\"lotus-pond\"}},{\"slug\":\"rama\",\"order\":9,\"enabled\":true,\"name\":\"Lord Rama\",\"nameDevanagari\":\"राम\",\"epithet\":\"Maryada Purushottam · The Ideal King\",\"shortDescription\":\"The ideal of righteousness, bearer of the Kodanda bow.\",\"description\":\"Sri Rama of the solar dynasty is remembered as the ideal of dharma — a son, king and friend who never wavered from truth. The Kodanda bow and the rising sun of his lineage stand for steadfast purpose. Rest here in the calm of righteousness.\",\"mantra\":{\"devanagari\":\"श्री राम जय राम जय जय राम\",\"transliteration\":\"Śrī Rāma Jaya Rāma Jaya Jaya Rāma\",\"meaning\":\"Glory to Sri Rama.\"},\"art\":{\"emblem\":\"rama\",\"image\":null,\"imageAlt\":\"The Kodanda bow and arrows before the sun of the solar dynasty\",\"credit\":\"Original placeholder emblem (SVG) — in-house. Replace with commissioned artwork when available.\"},\"theme\":{\"skyTop\":\"#140a24\",\"skyBottom\":\"#8a4a1c\",\"glow\":\"#ffd27a\",\"accent\":\"#f0a83a\",\"motif\":\"river\"}},{\"slug\":\"venkateswara\",\"order\":10,\"enabled\":true,\"name\":\"Lord Venkateswara\",\"nameDevanagari\":\"वेङ्कटेश्वर\",\"epithet\":\"Srinivasa · Lord of the Seven Hills\",\"shortDescription\":\"The compassionate Lord of the Seven Hills, a form of Vishnu.\",\"description\":\"Venkateswara — Srinivasa, Balaji, Govinda — is revered as the form of Vishnu who dwells upon the seven hills for the welfare of devotees in this age. He is remembered with the shankha and chakra and the sacred Urdhva Pundra on his brow. Offer your heart here in simple devotion.\",\"mantra\":{\"devanagari\":\"ॐ नमो वेङ्कटेशाय\",\"transliteration\":\"Om Namo Veṅkaṭeśāya\",\"meaning\":\"Salutations to Lord Venkatesha.\"},\"art\":{\"emblem\":\"venkateswara\",\"image\":null,\"imageAlt\":\"Urdhva Pundra between shankha and chakra above the seven hills\",\"credit\":\"Original placeholder emblem (SVG) — in-house. Replace with commissioned artwork when available.\"},\"theme\":{\"skyTop\":\"#0b0a24\",\"skyBottom\":\"#3a2a5a\",\"glow\":\"#ffd98a\",\"accent\":\"#f3d98b\",\"motif\":\"hills\"}}]}]}],[\"$L17\",\"$L18\"],\"$L19\"]}]\n"])</script><script>self.__next_f.push([1,"a:[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$L1b\",null,{\"children\":\"$L1c\"}],[\"$\",\"$L1e\",null,{\"children\":[[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$13\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L1f\"}]}],null]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}]\nc:[\"$\",\"link\",\"0\",{\"rel\":\"stylesheet\",\"href\":\"/Devadwar/_next/static/chunks/41ss8dbc60b7z.css\",\"precedence\":\"next\",\"crossOrigin\":\"$undefined\",\"nonce\":\"$undefined\"}]\n7:C\n17:[\"$\",\"script\",\"script-0\",{\"src\":\"/Devadwar/_next/static/chunks/3v3mm1wf6f2-r.js\",\"async\":true,\"nonce\":\"$undefined\"}]\n18:[\"$\",\"script\",\"script-1\",{\"src\":\"/Devadwar/_next/static/chunks/0gi6e32g09z8z.js\",\"async\":true,\"nonce\":\"$undefined\"}]\n19:[\"$\",\"$L20\",null,{\"children\":[\"$\",\"$13\",null,{\"name\":\"Next.MetadataOutlet\",\"children\":\"$@21\"}]}]\n1c:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1, viewport-fit=cover\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#05071a\"}]]\n1f:[[\"$\",\"title\",\"0\",{\"children\":\"Confirm your experience · Devadwar\"}],[\"$\",\"meta\",\"1\"
